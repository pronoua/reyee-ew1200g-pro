                  name: ds.0.hosts.0
                  value: '192.168.1.1'
                - type: STRING
                  name: ds.0.items.0
                  value: 'WAN: Traffic in'
                - type: STRING
                  name: ds.0.color
                  value: 1E90FF
                - type: INTEGER
                  name: ds.0.fill
                  value: '3'
                - type: STRING
                  name: ds.1.hosts.0
                  value: '192.168.1.1'
                - type: STRING
                  name: ds.1.items.0
                  value: 'WAN: Traffic out'
