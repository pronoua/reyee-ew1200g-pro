        - uuid: b536823de1af447cbddb40f79f34a115
          name: 'Memory utilization'
          type: CALCULATED
          key: reyee.mem.pused
          delay: 3m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          params: 'last(//reyee.mem.used) / last(//reyee.mem.total) * 100'
          tags:
            - tag: component
