        - uuid: f6c528b113e64bd2a48ae25abb2a3a03
          name: 'Memory free'
          type: DEPENDENT
          key: reyee.mem.free
          delay: '0'
          history: 7d
          trends: 365d
          units: B
          master_item:
            key: reyee.get.data
          preprocessing:
            - type: JSONPATH
              parameters:
