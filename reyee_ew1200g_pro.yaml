        - uuid: fc0387c4d02d430b8cf1e15b822457a4
          name: 'Clients: aggregate traffic in'
          type: DEPENDENT
          key: reyee.clients.bps.in
          delay: '0'
          history: 7d
          trends: 365d
          units: bps
          description: 'Sum of per-client downstream byte counters, converted to bits per second. Includes LAN-to-LAN traffic, so this is an approximation of WAN throughput, not an interface counter.'
          master_item:
            key: reyee.get.clients
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.down_total
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: component
              value: network
        - uuid: 3b7f0c1551144905ac985a23825237ad
          name: 'Clients: aggregate traffic out'
          type: DEPENDENT
          key: reyee.clients.bps.out
          delay: '0'
          history: 7d
          trends: 365d
          units: bps
          description: 'Sum of per-client upstream byte counters, converted to bits per second. Same caveat as the inbound item.'
          master_item:
            key: reyee.get.clients
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.up_total
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: component
              value: network
        - uuid: f18c676f7c914de1bfdb71fd00ac7771
          name: 'WAN: Traffic in'
          type: DEPENDENT
          key: reyee.wan.bps.in
          delay: '0'
          history: 7d
          trends: 365d
          units: bps
          description: 'Instantaneous downstream rate on the WAN interface, as reported by the flow module (func=interface_info). Already in bits per second - this is a gauge, not a counter, so no Change per second step is applied.'
          master_item:
            key: reyee.get.data
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.wan.down
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: component
              value: network
        - uuid: 8f55e85f8dd04a3dae466ae104e6e8f8
          name: 'WAN: Traffic out'
          type: DEPENDENT
          key: reyee.wan.bps.out
          delay: '0'
          history: 7d
          trends: 365d
          units: bps
          description: 'Instantaneous upstream rate on the WAN interface. Same source and caveats as the inbound item.'
          master_item:
            key: reyee.get.data
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.wan.up
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: component
              value: network
        - uuid: '38628412cbdd484b9882930d2752fd23'
          name: 'Active alarms'
          type: DEPENDENT
          key: reyee.alarms
          delay: '0'
          history: 7d
          trends: 365d
          description: 'Number of active alarms the router itself is raising (alarm_mngt). 0 means the device reports no problems.'
          master_item:
            key: reyee.get.clients
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alarms
          tags:
            - tag: component
              value: alarms
          triggers:
            - uuid: '819e004100384515afcd57364b05a56f'
              expression: 'last(/Ruijie Reyee EW1200G-PRO by eWeb API/reyee.alarms)>0'
              name: 'Reyee: Device is raising {ITEM.VALUE} alarm(s)'
              opdata: '{ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'The router has active alarms. See "Active alarm text" for details.'
              tags:
                - tag: scope
                  value: notice
        - uuid: '583eb9f81a0140f493c045392af72feb'
          name: 'Active alarm text'
          type: DEPENDENT
          key: reyee.alarm.text
          delay: '0'
          history: 7d
