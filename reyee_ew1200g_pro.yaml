        - uuid: 5ed7f1e9c37d4c79bad664754896721f
          name: 'Memory used'
          type: DEPENDENT
          key: reyee.mem.used
          delay: '0'
          history: 7d
          trends: 365d
          units: B
          master_item:
            key: reyee.get.data
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.overview.mem_used
            - type: MULTIPLIER
