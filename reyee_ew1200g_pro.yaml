zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 7e0c7029959b4c9fa1b4f46f03c168a2
      name: 'Templates/Network devices'
  templates:
    - uuid: a81e2e65b9e54853b6dd108367d2acaa
      template: 'Ruijie Reyee EW1200G-PRO by eWeb API'
      name: 'Ruijie Reyee EW1200G-PRO by eWeb API'
      description: |
        Monitoring of Ruijie/Reyee EW1200G-PRO (ReyeeOS) via the local eWeb HTTP API
        (/cgi-bin/luci/api/*). Logs in with POST /api/auth, then reuses the returned
        sid for the data calls in the same script run.

        Requires:
          - {$REYEE.PASSWORD} - eWeb admin password (secret macro)
          - {$REYEE.SCHEME}   - http or https
        Zabbix server/proxy must have IP access to the router web UI.
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 1742a3f3180141ee980470f16c969b2e
          name: 'Reyee: Get data'
          type: SCRIPT
          key: reyee.get.data
          delay: 3m
          history: '0'
          value_type: TEXT
          timeout: 30s
          params: |
            var p = JSON.parse(value);
            var base = p.scheme + '://' + p.host + '/cgi-bin/luci';
            var req = new HttpRequest();
            req.addHeader('Content-Type: application/json');

            var raw = req.post(base + '/api/auth', JSON.stringify({
                method: 'login',
                params: { password: p.password, encry: false, limit: false, setInit: false }
            }));
            if (req.getStatus() != 200) {
                throw 'auth: HTTP ' + req.getStatus();
            }
            var auth = JSON.parse(raw);
            if (auth.code != 0 || !auth.data || !auth.data.sid) {
                throw 'auth failed: ' + raw;
            }
            var sid = auth.data.sid;

            function call(path, body) {
                var r = req.post(base + path + '?auth=' + sid, JSON.stringify(body));
                if (req.getStatus() != 200) {
                    throw path + ': HTTP ' + req.getStatus();
                }
                var j = JSON.parse(r);
                if (j.code != 0) {
                    throw path + ': code ' + j.code;
                }
                return j.data;
            }

            var out = { sn: auth.data.sn };

            out.version  = call('/api/system',   { method: 'getVersion',    params: { deviceType: 'self' } });
            out.overview = call('/api/overview', { method: 'getDeviceInfo', params: null });
            out.ports    = call('/api/cmd',      { method: 'devSta.get',    params: { module: 'port_status', noParse: false, async: null, remoteIp: false, device: 'pc' } });

            // WAN throughput. The 'flow' module dispatches on data.func; 'interface_info'
            // returns the same instantaneous rate the eWeb overview widget displays.
            // Values are already bits per second - no counter maths needed.
            var fl = call('/api/cmd', { method: 'devSta.get', params: { module: 'flow', noParse: true, async: null, remoteIp: false, data: { func: 'interface_info' } } });
            out.wan = (fl && fl.data && fl.data.wan) ? fl.data.wan : {};

            return JSON.stringify(out);
          parameters:
            - name: host
              value: '{HOST.CONN}'
            - name: password
              value: '{$REYEE.PASSWORD}'
            - name: scheme
              value: '{$REYEE.SCHEME}'
          tags:
            - tag: component
              value: raw
        - uuid: fd2504a303aa4a3fa1906e14d30c2232
          name: 'Reyee: Get wireless config'
          type: SCRIPT
          key: reyee.get.wireless
          delay: 1h
          history: '0'
          value_type: TEXT
          timeout: 30s
          description: 'Wireless config changes rarely, polled separately at a low rate. SSID passwords are stripped before the value is stored.'
          params: |
            var p = JSON.parse(value);
            var base = p.scheme + '://' + p.host + '/cgi-bin/luci';
            var req = new HttpRequest();
            req.addHeader('Content-Type: application/json');

            var raw = req.post(base + '/api/auth', JSON.stringify({
                method: 'login',
                params: { password: p.password, encry: false, limit: false, setInit: false }
            }));
            if (req.getStatus() != 200) {
                throw 'auth: HTTP ' + req.getStatus();
            }
            var auth = JSON.parse(raw);
            if (auth.code != 0 || !auth.data || !auth.data.sid) {
                throw 'auth failed: ' + raw;
            }
            var sid = auth.data.sid;

            var r = req.post(base + '/api/cmd?auth=' + sid, JSON.stringify({
                method: 'acConfig.get',
                params: { module: 'wireless', noParse: false, async: null, remoteIp: false, device: 'pc' }
            }));
            if (req.getStatus() != 200) {
                throw 'acConfig.get: HTTP ' + req.getStatus();
            }
            var j = JSON.parse(r);
            if (j.code != 0) {
                throw 'acConfig.get: code ' + j.code;
            }

            var data = j.data;
            if (data && data.ssidList) {
                for (var i = 0; i < data.ssidList.length; i++) {
                    delete data.ssidList[i].password;
                }
            }

            return JSON.stringify(data);
          parameters:
            - name: host
              value: '{HOST.CONN}'
            - name: password
              value: '{$REYEE.PASSWORD}'
            - name: scheme
              value: '{$REYEE.SCHEME}'
          tags:
            - tag: component
              value: raw
        - uuid: 4a3586dd39ec4bd1b1bc7e2c179028b7
          name: 'Uptime'
          type: DEPENDENT
          key: reyee.uptime
          delay: '0'
          history: 7d
