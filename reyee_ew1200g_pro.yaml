        - uuid: eecd88f169e14495878ed7cf7c10923e
          name: 'Serial number'
          type: DEPENDENT
          key: reyee.sn
          delay: '0'
          history: 30d
          value_type: CHAR
          master_item:
            key: reyee.get.data
          preprocessing:
