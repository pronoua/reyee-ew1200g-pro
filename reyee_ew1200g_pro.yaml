              expression: change(/Ruijie Reyee EW1200G-PRO by eWeb API/reyee.fw)<>0 and length(last(/Ruijie Reyee EW1200G-PRO by eWeb API/reyee.fw))>0
              name: 'Reyee: Firmware version has changed'
              priority: INFO
