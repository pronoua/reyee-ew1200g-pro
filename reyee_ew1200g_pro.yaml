      macros:
        - macro: '{$REYEE.CLIENT.MATCHES}'
          value: '20:e7:c8:ad:3b:b8|fc:b4:67:c3:4e:54|ec:64:c9:e7:ca:71|bc:dd:c2:0e:44:ed|6c:f1:7e:4f:f4:9e|02:ba:e8:f5:65:de|58:0d:0d:c1:0e:39'
          description: 'Regex of client MACs to monitor individually, lowercase, pipe-separated. Add a MAC here and its items appear on the next discovery run - no template change needed. Use .* to monitor every client (expect Lost resources churn from phones and guests).'
        - macro: '{$REYEE.CLIENT.NOT_MATCHES}'
          value: '^$'
          description: 'Regex of client MACs to exclude, applied after MATCHES.'
        - macro: '{$REYEE.CHUTIL.MAX}'
          value: '70'
          description: 'Channel utilization threshold in percent for the congestion trigger.'
        - macro: '{$REYEE.RSSI.MIN}'
          value: '-80'
          description: 'Weak-signal threshold in dBm for whitelisted clients.'
        - macro: '{$REYEE.PASSWORD}'
          description: 'eWeb admin password. Must be set on the HOST, as plain Text - Zabbix does not expand Secret text macros in Script item parameters.'
        - macro: '{$REYEE.SCHEME}'
          value: http
          description: 'http or https, depending on what the eWeb UI is reachable on.'
        - macro: '{$REYEE.MEM.PUSED.MAX}'
          value: '90'
          description: 'Memory utilization threshold in percent.'
