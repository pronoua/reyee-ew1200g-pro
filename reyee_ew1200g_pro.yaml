          triggers:
            - uuid: a967853517cc4c0db3f5783625379df1
              expression: 'min(/Ruijie Reyee EW1200G-PRO by eWeb API/reyee.mem.pused,5m)>{$REYEE.MEM.PUSED.MAX}'
              name: 'Reyee: High memory utilization (>{$REYEE.MEM.PUSED.MAX}%)'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: performance
        - uuid: 233b3e00e38e4b78b1b906d40fc4f6ff
          name: 'Reyee: Get clients'
          type: SCRIPT
          key: reyee.get.clients
          delay: 5m
          history: '0'
          value_type: TEXT
          timeout: 30s
          description: 'Batched cmdArr call: user_list (all clients, with byte counters) + neighbor. Aggregates are computed in the script so dependent items stay simple.'
          params: |
            var p = JSON.parse(value);
            var base = p.scheme + '://' + p.host + '/cgi-bin/luci';
            var req = new HttpRequest();
            req.addHeader('Content-Type: application/json');

            var raw = req.post(base + '/api/auth', JSON.stringify({
                method: 'login',
                params: { password: p.password, encry: false, limit: false, setInit: false }
            }));
            if (req.getStatus() != 200) {
                throw 'auth: HTTP ' + req.getStatus();
            }
            var auth = JSON.parse(raw);
            if (auth.code != 0 || !auth.data || !auth.data.sid) {
                throw 'auth failed: ' + raw;
            }
            var sid = auth.data.sid;

            // one batched call: user_list + neighbor
            var r = req.post(base + '/api/cmd?auth=' + sid, JSON.stringify({
                method: 'cmdArr',
                params: {
                    device: 'pc',
                    noParse: true,
                    params: [
                        { method: 'devSta.get', params: { module: 'user_list', data: { devType: 'all', dataType: 'timely' } } },
                        { method: 'devSta.get', params: { module: 'neighbor' } },
                        { method: 'devSta.get', params: { module: 'ap_list', data: { productType: 'EHR', status: 'ON' } } },
                        { method: 'devSta.get', params: { module: 'alarm_mngt' } },
                        { method: 'devSta.get', params: { module: 'conflict_status' } }
                    ]
                }
            }));
            if (req.getStatus() != 200) {
                throw 'cmdArr: HTTP ' + req.getStatus();
            }
            var j = JSON.parse(r);
            if (j.code != 0) {
                throw 'cmdArr: code ' + j.code;
            }

            var arr = j.data || [];
            var users = (arr[0] && arr[0].list) ? arr[0].list : [];
            var nb = (arr[1] && arr[1].neighbor) ? arr[1].neighbor : [];
            var aps = (arr[2] && arr[2].list) ? arr[2].list : [];
            var alarms = (arr[3] && arr[3].list) ? arr[3].list : [];
            var conflict = (arr[4] && typeof arr[4].conflict_status !== 'undefined') ? arr[4].conflict_status : false;

            function num(v) {
                var n = parseInt(v, 10);
                return isNaN(n) ? 0 : n;
            }

            // rxrate arrives as "585M" / "9M" -> Mbps as integer
            function rate(v) {
                if (!v) { return 0; }
                var m = String(v).match(/([0-9.]+)/);
                return m ? Math.round(parseFloat(m[1])) : 0;
            }

            var out = {
                total: users.length,
                wired: 0,
                wireless: 0,
                band24: 0,
                band5: 0,
                up_total: 0,
                down_total: 0,
                per_ssid: {},
                per_ap: {},
                neighbors: nb.length,
                clients: []
            };

            for (var i = 0; i < users.length; i++) {
                var u = users[i];
                var mac = String(u.mac || '').toLowerCase();

                out.up_total += num(u.up);
                out.down_total += num(u.down);

                if (u.connectType === 'wire') {
                    out.wired++;
                } else {
                    out.wireless++;
                    if (u.band === '2.4G') { out.band24++; }
                    if (u.band === '5G') { out.band5++; }
                    if (u.ssid) {
                        out.per_ssid[u.ssid] = (out.per_ssid[u.ssid] || 0) + 1;
                    }
                    if (u.sn) {
                        out.per_ap[u.sn] = (out.per_ap[u.sn] || 0) + 1;
                    }
                }

                out.clients.push({
                    mac: mac,
                    ip: u.userIp || '',
                    host: u.hostName || u.name || '',
                    name: u.name || '',
                    conn: u.connectType || '',
                    ssid: u.ssid || '',
                    band: u.band || '',
                    ap: u.sn || '',
                    rssi: num(u.rssi),
                    rxrate: rate(u.rxrate),
                    channel: num(u.channel),
                    active: num(u.activeTime),
                    up: num(u.up),
                    down: num(u.down),
                    online: 1
                });
            }

            // Access points. Several fields pack the 2.4G and 5G radios into one
            // comma-joined string ("10,1"); split them into per-band rows so each
            // graph is clean. bands[i] lines up with the i-th value in each field.
            out.aps = [];
            for (var a = 0; a < aps.length; a++) {
                var ap = aps[a];
                var bands = String(ap.band || '').split(',');
                var chutil = String(ap.chutil || '').split(',');
                var channf = String(ap.channf || '').split(',');
                var txpow  = String(ap.txpower || '').split(',');
                var chans  = String(ap.channel || '').split(',');
                var radios = [];
                for (var b = 0; b < bands.length; b++) {
                    if (!bands[b]) { continue; }
                    radios.push({
                        band: bands[b],
                        chutil: num(chutil[b]),
                        noise: num(channf[b]),
                        txpower: num(txpow[b]),
                        channel: String(chans[b] || '').replace(/^auto-/, '')
                    });
                }
                out.aps.push({
                    sn: ap.serialNumber || '',
                    mac: ap.mac || '',
                    ip: ap.ip || '',
                    model: ap.devModel || '',
                    role: ap.forwardMode || '',
                    relay: ap.relayMode || '',
                    staNum: num(ap.staNum),
                    online: (ap.status === 'ON') ? 1 : 0,
                    radios: radios
                });
            }

            // flat radio list for LLD: one row per (ap, band)
            out.radios = [];
            for (var ri = 0; ri < out.aps.length; ri++) {
                var apx = out.aps[ri];
                for (var rj = 0; rj < apx.radios.length; rj++) {
                    var rd = apx.radios[rj];
                    out.radios.push({
                        sn: apx.sn,
                        apip: apx.ip,
                        band: rd.band,
                        key: apx.sn + '_' + rd.band,
                        chutil: rd.chutil,
                        noise: rd.noise,
                        txpower: rd.txpower,
                        channel: rd.channel
                    });
                }
            }

            out.alarms = alarms.length;
            out.alarm_text = alarms.map(function (x) { return x.msg || x.rcode || ''; }).join('; ');
            out.conflict = conflict ? 1 : 0;

            return JSON.stringify(out);
          parameters:
            - name: host
              value: '{HOST.CONN}'
            - name: password
              value: '{$REYEE.PASSWORD}'
            - name: scheme
              value: '{$REYEE.SCHEME}'
          tags:
            - tag: component
              value: raw
        - uuid: 2319854a88f64f6e850ac57b9ee2d401
